<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂词云 · 老师管理</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #050914;
            background-image:
                radial-gradient(1100px 560px at 85% -10%, rgba(77, 166, 255, .16), transparent 60%),
                radial-gradient(900px 520px at -12% 112%, rgba(124, 196, 255, .10), transparent 60%),
                radial-gradient(white, rgba(255, 255, 255, .14) 1.6px, transparent 2.4px),
                radial-gradient(white, rgba(255, 255, 255, .10) 1px, transparent 1.6px);
            background-size: auto, auto, 420px 420px, 260px 260px;
            background-position: 0 0, 0 0, 30px 40px, 180px 120px;
            color: #e8f0ff;
            min-height: 100vh;
        }
        .wrap { width: 92%; max-width: 860px; margin: 0 auto; padding: clamp(1.5rem, 5vh, 3rem) 0 4rem; }
        h1 {
            text-align: center; font-size: clamp(1.5rem, 5vw, 2.3rem); font-weight: 800;
            background: linear-gradient(120deg, #ffffff 10%, #7cc4ff 55%, #4da6ff 90%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 22px rgba(77, 166, 255, .35));
        }
        .subtitle { text-align: center; color: rgba(232,240,255,.62); margin: 0.5rem 0 2rem; }

        .panel {
            background: linear-gradient(160deg, rgba(22, 38, 74, .68), rgba(8, 15, 34, .78));
            border: 1px solid rgba(124, 196, 255, .22);
            border-radius: 20px;
            box-shadow: 0 12px 44px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            padding: clamp(1.1rem, 3vw, 1.8rem);
            margin-bottom: 1.4rem;
        }
        .panel h2 { color: #7cc4ff; font-size: 1.15rem; margin-bottom: 0.9rem; }

        label { display: block; font-size: 0.88rem; color: rgba(232,240,255,.62); margin: 0.7rem 0 0.25rem; }
        input[type="text"], input[type="password"] {
            width: 100%; background: rgba(6, 12, 28, .72);
            border: 1px solid rgba(124, 196, 255, .35); border-radius: 12px;
            color: #fff; padding: 0.65rem 0.9rem; font-size: 1rem; font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus { outline: none; border-color: #4da6ff; box-shadow: 0 0 0 3px rgba(77,166,255,.22); }

        .btn {
            background: linear-gradient(135deg, #7cc4ff, #4da6ff 60%, #1d4ed8);
            color: #04101f; border: none; border-radius: 12px;
            font-weight: 700; padding: 0.65rem 1.5rem; font-size: 0.95rem;
            font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px rgba(77, 166, 255, .35);
            transition: transform .12s, box-shadow .2s, filter .2s; margin-top: 1rem;
        }
        .btn:hover { filter: brightness(1.08); box-shadow: 0 8px 26px rgba(77, 166, 255, .5); }
        .btn:active { transform: scale(.97); }
        .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.85rem; margin-top: 0; }
        .btn-ghost {
            background: transparent; color: #7cc4ff; border: 1px solid rgba(124,196,255,.35);
            font-weight: 500; box-shadow: none;
        }
        .btn-ghost:hover { background: rgba(77,166,255,.12); filter: none; box-shadow: none; }
        .btn-danger {
            background: transparent; color: #ff8a80; border: 1px solid rgba(255,138,128,.45);
            font-weight: 500; box-shadow: none;
        }
        .btn-danger:hover { background: rgba(255,138,128,.12); filter: none; box-shadow: none; }
        .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        a.btn { text-decoration: none; display: inline-flex; align-items: center; }

        .session {
            border: 1px solid rgba(124, 196, 255, .2);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            margin-bottom: 0.9rem;
            background: rgba(10, 25, 50, .4);
            transition: border-color .2s, background .2s;
        }
        .session:hover { border-color: rgba(124, 196, 255, .45); background: rgba(14, 30, 60, .5); }
        .session-head { display: flex; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; align-items: baseline; }
        .session-title { font-size: 1.1rem; font-weight: bold; color: #7cc4ff; }
        .session-code {
            font-family: 'Courier New', monospace; font-size: 1.25rem; letter-spacing: 0.2em;
            color: #ffb347; text-shadow: 0 0 10px rgba(255,179,71,0.5);
        }
        .session-prompt { color: rgba(232,240,255,.85); font-size: 0.92rem; margin: 0.4rem 0; }
        .session-stats { font-size: 0.85rem; color: rgba(232,240,255,.55); margin-bottom: 0.7rem; }
        .empty-note { color: rgba(232,240,255,.5); font-style: italic; text-align: center; padding: 1rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.6rem; }

        .footer-links { text-align: center; margin-top: 2rem; }
        .footer-links a { color: rgba(232,240,255,.45); font-size: 0.85rem; text-decoration: none; transition: color .2s; }
        .footer-links a:hover { color: #7cc4ff; }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; align-items: center;
            width: min(92vw, 460px);
        }
        .toast-msg {
            padding: 0.7rem 1.3rem; border-radius: 12px; font-size: 0.95rem;
            background: rgba(10, 25, 50, 0.95); border: 1px solid rgba(124,196,255,0.45);
            box-shadow: 0 6px 24px rgba(0,0,0,0.6);
        }
        .toast-msg.error { border-color: rgba(255, 95, 95, 0.7); color: #ffcdd2; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>🛠️ 课堂词云 · 老师管理</h1>
    <p class="subtitle">创建词云、分享邀请码、清空或删除词云</p>

    <!-- 登录 -->
    <div class="panel" id="loginPanel" style="max-width:420px;margin:2rem auto;">
        <h2>老师登录</h2>
        <form id="loginForm">
            <label>老师密码</label>
            <input type="password" id="teacherPassword" autocomplete="off" required>
            <button class="btn" type="submit">登录</button>
        </form>
    </div>

    <!-- 管理面板 -->
    <div id="adminView" hidden>
        <div class="top-bar">
            <button class="btn btn-ghost btn-sm" id="refreshBtn">🔄 刷新列表</button>
            <button class="btn btn-danger btn-sm" id="logoutBtn">退出登录</button>
        </div>

        <div class="panel">
            <h2>➕ 创建新词云</h2>
            <form id="createForm">
                <label>词云标题 / 问题 <span style="color:#ffb347">*</span></label>
                <input type="text" id="newTitle" maxlength="60" required placeholder="例如：用一个词形容「创业」">
                <label>补充说明（可选）</label>
                <input type="text" id="newPrompt" maxlength="200" placeholder="例如：想到什么就提交什么，可以重复提交">
                <button class="btn" type="submit">创建并生成邀请码</button>
            </form>
        </div>

        <div class="panel">
            <h2>📋 已有词云</h2>
            <div id="sessionsBox"><p class="empty-note">加载中…</p></div>
        </div>
    </div>

    <div class="footer-links">
        <a href="wordcloud.html">学生端词云页面</a> · <a href="index.html">返回首页</a>
    </div>
</div>

<script src="js/wordcloud-common.js"></script>
<script>
(function () {
    const { api, getTeacherToken, setTeacherToken, esc, toast, copyText } = window.WC;
    const loginPanel = document.getElementById('loginPanel');
    const adminView = document.getElementById('adminView');
    const sessionsBox = document.getElementById('sessionsBox');
    let sessions = [];
    let pollTimer = null;

    function shareLink(code) {
      return location.origin + '/wordcloud.html?c=' + code;
    }

    // ── 登录 ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api('/api/teacher/login', {
          method: 'POST',
          body: { password: document.getElementById('teacherPassword').value },
        });
        setTeacherToken(data.token);
        enterAdmin();
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      setTeacherToken('');
      location.reload();
    });
    document.getElementById('refreshBtn').addEventListener('click', loadSessions);

    async function enterAdmin() {
      loginPanel.hidden = true;
      adminView.hidden = false;
      await loadSessions();
      pollTimer = setInterval(loadSessions, 10000);
    }

    async function loadSessions() {
      try {
        const data = await api('/api/wordcloud/sessions', { token: getTeacherToken() });
        sessions = data.sessions;
        render();
      } catch (err) {
        if (err.expired) { setTeacherToken(''); location.reload(); }
        else toast(err.message, 'error');
      }
    }

    function render() {
      if (!sessions.length) {
        sessionsBox.innerHTML = '<p class="empty-note">还没有词云，在上方创建一个吧。</p>';
        return;
      }
      sessionsBox.innerHTML = sessions.map((s) =>
        '<div class="session">' +
          '<div class="session-head">' +
            '<span class="session-title">' + esc(s.title) + '</span>' +
            '<span class="session-code">' + esc(s.code) + '</span>' +
          '</div>' +
          (s.prompt ? '<p class="session-prompt">' + esc(s.prompt) + '</p>' : '') +
          '<p class="session-stats">' + s.totalWords + ' 次提交 · ' + s.uniqueWords + ' 个不同词</p>' +
          '<div class="btn-row">' +
            '<button class="btn btn-ghost btn-sm" data-action="copy" data-code="' + esc(s.code) + '">🔗 复制邀请链接</button>' +
            '<a class="btn btn-ghost btn-sm" href="wordcloud.html?c=' + esc(s.code) + '" target="_blank" rel="noopener">▶️ 打开词云</a>' +
            '<button class="btn btn-ghost btn-sm" data-action="reset" data-code="' + esc(s.code) + '" data-title="' + esc(s.title) + '">🧹 清空词语</button>' +
            '<button class="btn btn-danger btn-sm" data-action="delete" data-code="' + esc(s.code) + '" data-title="' + esc(s.title) + '">🗑️ 删除词云</button>' +
          '</div>' +
        '</div>'
      ).join('');
    }

    sessionsBox.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, code, title } = btn.dataset;

      if (action === 'copy') {
        const ok = await copyText(shareLink(code));
        toast(ok ? '邀请链接已复制' : '复制失败，请手动复制：' + shareLink(code), ok ? 'success' : 'error');
        return;
      }
      if (action === 'reset') {
        if (!confirm('确定清空「' + title + '」的所有词语？（词云和邀请码保留）')) return;
        try {
          await api('/api/wordcloud/sessions/' + code + '/reset', {
            method: 'POST', body: {}, token: getTeacherToken(),
          });
          toast('已清空');
          loadSessions();
        } catch (err) { toast(err.message, 'error'); }
        return;
      }
      if (action === 'delete') {
        if (!confirm('确定删除词云「' + title + '」？学生将无法再访问该邀请码，此操作不可恢复。')) return;
        try {
          await api('/api/wordcloud/sessions/' + code, {
            method: 'DELETE', token: getTeacherToken(),
          });
          toast('已删除');
          loadSessions();
        } catch (err) { toast(err.message, 'error'); }
      }
    });

    // ── 创建 ──
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api('/api/wordcloud/sessions', {
          method: 'POST',
          body: {
            title: document.getElementById('newTitle').value.trim(),
            prompt: document.getElementById('newPrompt').value.trim(),
          },
          token: getTeacherToken(),
        });
        document.getElementById('newTitle').value = '';
        document.getElementById('newPrompt').value = '';
        const link = shareLink(data.session.code);
        await copyText(link);
        toast('创建成功！邀请链接已复制：' + link);
        loadSessions();
      } catch (err) { toast(err.message, 'error'); }
    });

    // ── 自动登录 ──
    if (getTeacherToken()) enterAdmin();
})();
</script>
</body>
</html>
