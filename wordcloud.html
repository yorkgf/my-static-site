<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂词云 · Word Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #4da6ff;
            --blue-l: #7cc4ff;
            --blue-d: #1d4ed8;
            --amber: #ffb347;
            --bg: #050914;
            --ink: #e8f0ff;
            --muted: rgba(232, 240, 255, .62);
            --glass: linear-gradient(160deg, rgba(22, 38, 74, .68), rgba(8, 15, 34, .78));
            --glass-border: rgba(124, 196, 255, .22);
            --shadow: 0 12px 44px rgba(0, 0, 0, .5);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(1100px 560px at 85% -10%, rgba(77, 166, 255, .16), transparent 60%),
                radial-gradient(900px 520px at -12% 112%, rgba(124, 196, 255, .10), transparent 60%),
                radial-gradient(620px 420px at 50% 55%, rgba(255, 179, 71, .05), transparent 70%),
                radial-gradient(white, rgba(255, 255, 255, .14) 1.6px, transparent 2.4px),
                radial-gradient(white, rgba(255, 255, 255, .10) 1px, transparent 1.6px);
            background-size: auto, auto, auto, 420px 420px, 260px 260px;
            background-position: 0 0, 0 0, 0 0, 30px 40px, 180px 120px;
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.6;
        }

        .wrap {
            width: 92%;
            max-width: 920px;
            margin: 0 auto;
            padding: clamp(1.5rem, 5vh, 3rem) 0;
        }

        /* ── Header ─────────────────────────────── */
        .head { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: clamp(1.7rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: .02em;
            background: linear-gradient(120deg, #ffffff 10%, var(--blue-l) 55%, var(--blue) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 22px rgba(77, 166, 255, .35));
        }
        .subtitle { color: var(--muted); margin-top: .5rem; font-size: clamp(.92rem, 2.5vw, 1.08rem); }

        /* ── Panel ──────────────────────────────── */
        .panel {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .06);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            padding: clamp(1.3rem, 4vw, 2.2rem);
            margin-bottom: 1.5rem;
        }

        /* ── 加入页 ─────────────────────────────── */
        .join-view { text-align: center; }
        .join-cloud { font-size: clamp(3rem, 9vw, 4.4rem); display: inline-block; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 8px 22px rgba(77,166,255,.4)); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .join-code {
            display: flex; gap: .7rem; justify-content: center;
            flex-wrap: wrap; margin-top: 1.4rem;
        }
        .join-code input {
            width: min(100%, 260px);
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: .45em;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            padding: .7rem 1rem;
        }
        .hint { color: var(--muted); font-size: .85rem; margin-top: .9rem; }

        /* ── 表单控件 ───────────────────────────── */
        input, button { font-family: inherit; font-size: 1rem; border-radius: 12px; }
        input[type="text"] {
            background: rgba(6, 12, 28, .72);
            border: 1px solid rgba(124, 196, 255, .35);
            color: #fff;
            padding: .7rem 1rem;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(77, 166, 255, .22), 0 0 18px rgba(77, 166, 255, .18); }
        input::placeholder { color: rgba(232, 240, 255, .35); }

        .btn {
            background: linear-gradient(135deg, var(--blue-l), var(--blue) 60%, var(--blue-d));
            color: #04101f;
            border: none;
            font-weight: 700;
            padding: .75rem 1.8rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(77, 166, 255, .35);
            transition: transform .12s, box-shadow .2s, filter .2s;
        }
        .btn:hover { filter: brightness(1.08); box-shadow: 0 8px 26px rgba(77, 166, 255, .5); }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; box-shadow: none; }
        .btn-ghost {
            background: transparent;
            color: var(--blue-l);
            border: 1px solid rgba(124, 196, 255, .35);
            font-weight: 500;
            padding: .5rem 1.1rem;
            font-size: .9rem;
            box-shadow: none;
        }
        .btn-ghost:hover { background: rgba(77, 166, 255, .12); filter: none; box-shadow: none; }

        /* ── 词云页 ─────────────────────────────── */
        .wc-code-line { text-align: center; font-family: 'Courier New', monospace; color: var(--muted); font-size: .88rem; }
        .wc-code-line b { color: var(--amber); letter-spacing: .2em; text-shadow: 0 0 12px rgba(255, 179, 71, .45); }
        .wc-title {
            font-size: clamp(1.3rem, 4vw, 1.9rem);
            color: var(--ink);
            text-align: center;
            margin: .3rem 0 .1rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, var(--blue-l));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .wc-prompt { text-align: center; color: var(--muted); margin: .3rem 0 .6rem; font-size: clamp(.98rem, 3vw, 1.18rem); }

        #cloudBox {
            position: relative;
            width: 100%;
            height: clamp(300px, 50vh, 540px);
            margin: .6rem 0;
            background:
                radial-gradient(120% 100% at 50% 0%, rgba(77, 166, 255, .08), transparent 60%),
                rgba(4, 9, 22, .5);
            border: 1px dashed rgba(124, 196, 255, .22);
            border-radius: 16px;
            overflow: hidden;
        }
        #cloud { width: 100%; height: 100%; display: block; }

        .wc-empty {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); font-size: 1.05rem;
        }
        .wc-empty .empty-inner { text-align: center; }
        .wc-empty .empty-emoji { font-size: 2.6rem; display: block; margin-bottom: .4rem; animation: float 3.6s ease-in-out infinite; }

        .hot-row { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; margin-top: .8rem; min-height: 2rem; }
        .hot-chip {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .32rem .85rem; border-radius: 100px;
            font-size: .9rem; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, .14);
            background: rgba(10, 20, 44, .7);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
        }
        .hot-chip b { font-weight: 800; }
        .hot-chip .flame { font-size: .85em; }
        .hot-chip.r1 { color: #fff; border-color: rgba(255, 179, 71, .5); background: linear-gradient(135deg, rgba(255, 179, 71, .22), rgba(255, 138, 101, .12)); }
        .hot-chip.r1 b { color: var(--amber); }
        .hot-chip.r2 { color: #dbeafe; }
        .hot-chip.r2 b { color: var(--blue-l); }
        .hot-chip.r3 { color: #d1d5db; }
        .hot-chip.r3 b { color: #93c5fd; }

        .submit-row { display: flex; gap: .7rem; margin-top: .8rem; flex-wrap: wrap; }
        .submit-row input { flex: 1; min-width: 200px; }
        .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: .9rem; flex-wrap: wrap; gap: .5rem; color: var(--muted); font-size: .9rem; }
        .meta-row .total { color: var(--ink); font-weight: 600; }

        .footer-links { text-align: center; margin-top: 2rem; }
        .footer-links a { color: rgba(232, 240, 255, .45); font-size: .85rem; text-decoration: none; transition: color .2s; }
        .footer-links a:hover { color: var(--blue-l); }

        /* ── Toast ──────────────────────────────── */
        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; gap: .5rem; align-items: center;
            width: min(92vw, 460px);
        }
        .toast-msg {
            padding: .7rem 1.3rem; border-radius: 12px; font-size: .95rem;
            background: rgba(10, 25, 50, .95); border: 1px solid rgba(124, 196, 255, .45);
            box-shadow: 0 6px 24px rgba(0, 0, 0, .6);
        }
        .toast-msg.error { border-color: rgba(255, 95, 95, .7); color: #ffcdd2; }
        .toast-msg.success { border-color: rgba(102, 187, 106, .7); color: #c8e6c9; }
        [hidden] { display: none !important; }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <h1>☁️ 课堂词云</h1>
        <p class="subtitle">输入老师给的邀请码，提交你的词 —— 同一个词提交的人越多，显示得越大</p>
    </div>

    <!-- 加入页 -->
    <div class="panel join-view" id="joinView">
        <span class="join-cloud">☁️</span>
        <div class="join-code">
            <input type="text" id="codeInput" maxlength="6" placeholder="邀请码" autocomplete="off" autofocus>
            <button class="btn" id="joinBtn">进入词云</button>
        </div>
        <p class="hint">邀请码是 6 位字符，由老师在创建词云时提供</p>
    </div>

    <!-- 词云页 -->
    <div id="sessionView" hidden>
        <div class="panel">
            <div class="wc-code-line">词云邀请码：<b id="codeDisplay"></b></div>
            <h2 class="wc-title" id="wcTitle"></h2>
            <p class="wc-prompt" id="wcPrompt"></p>
            <div id="cloudBox">
                <canvas id="cloud"></canvas>
                <div class="wc-empty" id="cloudEmpty">
                    <div class="empty-inner">
                        <span class="empty-emoji">☁️</span>
                        <p>还没有词，快来提交第一个吧！</p>
                    </div>
                </div>
            </div>
            <div class="hot-row" id="hotRow"></div>
            <div class="submit-row">
                <input type="text" id="wordInput" maxlength="20" placeholder="输入一个词，回车提交" autocomplete="off">
                <button class="btn" id="submitBtn">提交</button>
            </div>
            <div class="meta-row">
                <span class="total" id="totalLabel">共 0 次提交</span>
                <button class="btn-ghost" id="leaveBtn">← 换一个词云</button>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <a href="index.html">← 返回首页</a>
    </div>
</div>

<script src="js/wordcloud2.min.js"></script>
<script>window.WordCloud || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"><\/script>');</script>
<script src="js/wordcloud-common.js"></script>
<script>
(function () {
    const { api, esc, toast } = window.WC;
    const joinView = document.getElementById('joinView');
    const sessionView = document.getElementById('sessionView');
    const cloudCanvas = document.getElementById('cloud');
    const cloudEmpty = document.getElementById('cloudEmpty');
    let code = '';
    let pollTimer = null;
    let lastSignature = '';

    // 字体大小：随热度从 16px 拉到 96px，差异明显
    const MIN_PX = 16, MAX_PX = 96;

    // 热度配色：冷色（少）→ 暖色 → 白色（最多）
    const COLOR_STOPS = [
        [96, 165, 250],   // #60a5fa 冷蓝
        [56, 189, 248],   // #38bdf8 天蓝
        [125, 211, 252],  // #7dd3fc 亮蓝
        [251, 191, 36],   // #fbbf24 琥珀
        [251, 113, 133],  // #fb7185 玫红
        [255, 255, 255],  // #ffffff 白
    ];

    function heatOf(count, minCount, range) {
        if (range === 0) return 0.55;               // 全部相同 → 中间色
        return Math.max(0, Math.min(1, (count - minCount) / range));
    }
    function colorFor(count, minCount, range) {
        const t = heatOf(count, minCount, range);
        const pos = t * (COLOR_STOPS.length - 1);
        const i = Math.min(Math.floor(pos), COLOR_STOPS.length - 2);
        const f = pos - i;
        const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
        const rgb = a.map((v, k) => Math.round(v + (b[k] - v) * f));
        return 'rgb(' + rgb.join(',') + ')';
    }

    function enterSession(c) {
      code = c.toUpperCase();
      joinView.hidden = true;
      sessionView.hidden = false;
      document.getElementById('codeDisplay').textContent = code;
      history.replaceState(null, '', '?c=' + code);
      poll();
      pollTimer = setInterval(poll, 3000);
      document.getElementById('wordInput').focus();
    }

    function leaveSession() {
      clearInterval(pollTimer);
      sessionView.hidden = true;
      joinView.hidden = false;
      code = '';
      lastSignature = '';
      document.getElementById('hotRow').innerHTML = '';
      history.replaceState(null, '', window.location.pathname);
      document.getElementById('codeInput').value = '';
      document.getElementById('codeInput').focus();
    }

    async function join() {
      const c = document.getElementById('codeInput').value.trim().toUpperCase();
      if (c.length !== 6) return toast('请输入 6 位邀请码', 'error');
      try {
        await api('/api/wordcloud/sessions/' + c);
        enterSession(c);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function poll() {
      try {
        const data = await api('/api/wordcloud/sessions/' + code);
        document.getElementById('wcTitle').textContent = data.session.title;
        document.getElementById('wcPrompt').textContent = data.session.prompt || '';
        document.getElementById('totalLabel').textContent = '共 ' + data.total + ' 次提交';
        const signature = data.words.map((w) => w.word + ':' + w.count).join('|');
        if (signature !== lastSignature) {
          lastSignature = signature;
          renderHot(data.words);
          drawCloud(data.words);
        }
      } catch (err) {
        if (err.message.includes('不存在') || err.message.includes('邀请码')) {
          toast('词云已被老师关闭', 'error');
          leaveSession();
        }
      }
    }

    // 顶部热词条：Top 3
    function renderHot(words) {
      const box = document.getElementById('hotRow');
      if (!words.length) { box.innerHTML = ''; return; }
      const FLAMES = ['🔥', '⭐', '✨'];
      box.innerHTML = words.slice(0, 3).map((w, i) =>
        '<span class="hot-chip r' + (i + 1) + '"><span class="flame">' + FLAMES[i] + '</span>' +
        esc(w.word) + ' <b>×' + w.count + '</b></span>'
      ).join('');
    }

    function drawCloud(words) {
      cloudEmpty.hidden = words.length > 0;
      if (!words.length) {
        const ctx = cloudCanvas.getContext('2d');
        ctx.clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
        return;
      }
      const box = document.getElementById('cloudBox');
      const dpr = window.devicePixelRatio || 1;
      const w = box.clientWidth;
      const h = box.clientHeight;
      cloudCanvas.width = w * dpr;
      cloudCanvas.height = h * dpr;

      const maxCount = words[0].count;
      const minCount = words[words.length - 1].count;
      const range = maxCount - minCount;          // 0 → 全部相同
      const scale = Math.min(w / 620, 1.15);

      const sizeFor = (c) =>
        range === 0 ? 34 : MIN_PX + heatOf(c, minCount, range) * (MAX_PX - MIN_PX);

      WordCloud(cloudCanvas, {
        list: words.map((x) => [x.word, x.count]),
        gridSize: Math.round(13 * scale),
        weightFactor: (weight) => sizeFor(weight) * scale * dpr,
        fontFamily: '"PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif',
        color: (word, weight) => colorFor(weight, minCount, range),
        backgroundColor: 'transparent',
        rotateRatio: 0.12,
        minSize: 10,
        shuffle: false,
      });
    }

    async function submitWord() {
      const input = document.getElementById('wordInput');
      const word = input.value.trim();
      if (!word) return;
      const btn = document.getElementById('submitBtn');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '提交中…';
      try {
        await api('/api/wordcloud/sessions/' + code + '/words', {
          method: 'POST',
          body: { word },
        });
        input.value = '';
        btn.textContent = '✓ 已提交';
        poll();
        setTimeout(() => { btn.textContent = original; }, 1200);
      } catch (err) {
        toast(err.message, 'error');
        btn.textContent = original;
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    document.getElementById('joinBtn').addEventListener('click', join);
    document.getElementById('codeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') join();
    });
    document.getElementById('submitBtn').addEventListener('click', submitWord);
    document.getElementById('wordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitWord();
    });
    document.getElementById('leaveBtn').addEventListener('click', leaveSession);
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { lastSignature = ''; if (code) poll(); }, 300);
    });

    // 支持 ?c=邀请码 直接进入
    const urlCode = new URLSearchParams(location.search).get('c');
    if (urlCode && /^[A-Za-z0-9]{6}$/.test(urlCode)) {
      document.getElementById('codeInput').value = urlCode.toUpperCase();
      join();
    }
})();
</script>
</body>
</html>
